<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerita Kita · 我們的印尼故事手札</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 輕量 EXIF 讀取套件，用於解析拍攝時間與 GPS -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #FAF6F0;
      color: #3D2E24;
    }
    .font-serif-title {
      font-family: 'Playfair Display', 'Noto Sans TC', serif;
    }
    /* 3D 卡片翻轉特效 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transform: rotateY(180deg);
      overflow-y: auto;
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #D6C7B7;
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-[#FAF6F0]/90 backdrop-blur-md border-b border-[#E6DCD0]">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-serif-title text-2xl sm:text-3xl font-bold text-[#4A3525] tracking-tight">
          Cerita Kita <span class="text-sm font-normal text-[#8C6D53] ml-1">· 我們的印尼故事手札</span>
        </h1>
        <p class="text-xs text-[#7D6654] mt-0.5">記錄日常互動、道地印尼語氣與專屬彼此的小默契</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportJSON()" class="px-3 py-2 text-xs sm:text-sm rounded-xl border border-[#D4C3B0] bg-white hover:bg-[#F3ECE2] text-[#5C4433] transition flex items-center gap-1.5 shadow-sm">
          <span>📥</span> 匯出 JSON
        </button>
        <label class="px-3 py-2 text-xs sm:text-sm rounded-xl border border-[#D4C3B0] bg-white hover:bg-[#F3ECE2] text-[#5C4433] transition flex items-center gap-1.5 shadow-sm cursor-pointer">
          <span>📤</span> 匯入
          <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>
        <button onclick="openCreateModal()" class="px-4 py-2 text-xs sm:text-sm font-medium rounded-xl bg-[#C85A32] hover:bg-[#B04B26] text-white transition flex items-center gap-1.5 shadow-sm">
          <span>＋</span> 新增故事
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-8">

    <!-- 她的小默契雷達區 -->
    <section class="bg-white/90 rounded-2xl border border-[#E6DCD0] p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-bold text-[#4A3525] flex items-center gap-2">
          <span>✨</span> 她的小默契雷達（自動從故事彙整）
        </h2>
        <span id="prefCount" class="text-xs px-2.5 py-0.5 rounded-full bg-[#F5EBE0] text-[#8C5E3C]">0 項線索</span>
      </div>
      <div id="preferencesList" class="flex flex-wrap gap-2">
        <!-- 動態產生默契標籤 -->
      </div>
    </section>

    <!-- 篩選與搜尋列 -->
    <section class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <input id="searchInput" type="text" oninput="renderStories()" placeholder="搜尋故事內容、印尼文單字、地點或標籤..."
          class="w-full pl-9 pr-4 py-2.5 text-sm rounded-xl bg-white border border-[#DFD3C3] focus:outline-none focus:border-[#C85A32]" />
        <span class="absolute left-3 top-2.5 text-[#9E8875]">🔍</span>
      </div>
      <div id="tagFilterBar" class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
        <!-- 動態產生標籤篩選 -->
      </div>
    </section>

    <!-- 故事時間軸卡片網格 -->
    <section id="storiesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 動態產生故事卡片 -->
    </section>

  </main>

  <!-- 新增 / 編輯故事 Modal -->
  <div id="storyModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#FFFDF9] border border-[#E6DCD0] rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b border-[#EFE6DA] pb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-[#4A3525]">新增故事片段</h3>
        <button onclick="closeModal()" class="text-[#8C6D53] hover:text-[#3D2E24] text-xl leading-none">&times;</button>
      </div>

      <!-- 照片上傳與 EXIF 自動讀取區塊 -->
      <div class="bg-[#F8F2EA] border border-dashed border-[#D2BFA9] rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium text-[#5C4433] flex items-center gap-1.5">
            <span>📸</span> 記憶照片（自動讀取拍攝日期與 GPS 地點）
          </label>
          <button type="button" id="removePhotoBtn" onclick="clearPhoto()" class="hidden text-xs text-red-600 hover:underline">移除照片</button>
        </div>

        <div id="photoUploadArea" onclick="document.getElementById('photoInput').click()"
          class="cursor-pointer py-4 px-3 rounded-lg bg-white/70 hover:bg-white border border-[#E5D7C6] text-center transition">
          <p class="text-xs text-[#7D6654]">點擊選擇照片（支援 JPG / PNG / WebP，會自動壓縮並解析 EXIF）</p>
          <input id="photoInput" type="file" accept="image/*" onchange="handlePhotoUpload(event)" class="hidden" />
        </div>

        <div id="photoPreviewWrap" class="hidden space-y-2">
          <img id="photoPreviewImg" src="" alt="預覽照片" class="max-h-52 mx-auto rounded-lg shadow-sm object-contain bg-white p-1.5 border border-[#E5D7C6]" />
          <p id="exifStatusMsg" class="text-xs text-center text-[#8C5E3C]"></p>
        </div>
      </div>

      <!-- 基本日期與地點 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">日期</label>
          <input id="fieldDate" type="date" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">地點</label>
          <input id="fieldLocation" type="text" placeholder="例如：台南 / 線上聊天" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">互動氛圍 (Mood)</label>
          <input id="fieldMood" type="text" placeholder="例如：溫暖、搞笑" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
        </div>
      </div>

      <!-- 原始紀錄輸入 + AI 自動解析按鈕 (僅在新增模式特別醒目) -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-medium text-[#6E5643]">互動片段 / 對話紀錄原文</label>
          <button type="button" onclick="fillSampleInput()" class="text-xs text-[#C85A32] hover:underline">填入測試範例文字</button>
        </div>
        <textarea id="fieldRawInput" rows="3" placeholder="貼上你們的聊天片段、今天發生的小事，或她教你的印尼文..."
          class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white focus:outline-none focus:border-[#C85A32]"></textarea>

        <!-- AI 解析控制列 -->
        <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
          <details class="text-xs text-[#7D6654]">
            <summary class="cursor-pointer hover:text-[#4A3525]">⚙️ 設定 Gemini API Key（選填，留空則用內建智慧模擬）</summary>
            <div class="mt-2 flex items-center gap-2">
              <input id="geminiApiKeyInput" type="password" placeholder="貼上 AIzaSy... 金鑰（僅存於本機瀏覽器）"
                onchange="saveApiKey(this.value)"
                class="px-2.5 py-1.5 rounded border border-[#DFD3C3] bg-white text-xs w-64" />
            </div>
          </details>
          <button type="button" id="aiAnalyzeBtn" onclick="runAIAnalysis()"
            class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-[#4A3525] hover:bg-[#332419] text-white transition flex items-center gap-1.5">
            <span>🪄</span> AI 自動生成標題與印尼文筆記
          </button>
        </div>
      </div>

      <!-- 故事標題與摘要（可手動微調） -->
      <div class="grid grid-cols-1 gap-3 pt-2 border-t border-[#EFE6DA]">
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">故事標題</label>
          <input id="fieldTitle" type="text" placeholder="有畫面感的一句短標" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">故事摘要</label>
          <textarea id="fieldSummary" rows="2" placeholder="簡短整理這段互動的重點" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white"></textarea>
        </div>
      </div>

      <!-- 印尼文詞彙筆記編輯器 -->
      <div class="space-y-2 pt-2 border-t border-[#EFE6DA]">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-[#4A3525]">🇮🇩 印尼文語氣與單字筆記</label>
          <button type="button" onclick="addNoteRow()" class="text-xs px-2.5 py-1 rounded bg-[#F3ECE2] hover:bg-[#E6DACB] text-[#5C4433]">＋ 新增單字</button>
        </div>
        <div id="notesEditorList" class="space-y-2">
          <!-- 動態產生單字編輯列 -->
        </div>
      </div>

      <!-- 文化彩蛋與標籤 -->
      <div class="grid grid-cols-1 gap-3 pt-2 border-t border-[#EFE6DA]">
        <div>
          <label class="block text-xs font-medium text-[#6E5643] mb-1">🌏 印尼文化 / 生活彩蛋</label>
          <textarea id="fieldTrivia" rows="2" placeholder="補充相關的印尼飲食、習慣或文化脈絡" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#6E5643] mb-1">✨ 提取她的小默契（格式：分類:細節，多筆用逗號隔開）</label>
            <input id="fieldPrefs" type="text" placeholder="例如：飲食:喜歡吃辣, 飲料:愛喝無糖綠" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
          </div>
          <div>
            <label class="block text-xs font-medium text-[#6E5643] mb-1">🏷️ 標籤（用逗號分隔）</label>
            <input id="fieldTags" type="text" placeholder="例如：#美食, #日常聊天" class="w-full px-3 py-2 text-sm rounded-lg border border-[#DFD3C3] bg-white" />
          </div>
        </div>
      </div>

      <!-- 底部操作按鈕 -->
      <div class="flex items-center justify-between pt-4 border-t border-[#EFE6DA]">
        <button type="button" id="deleteStoryBtn" onclick="deleteCurrentStory()" class="hidden px-3 py-2 text-xs rounded-lg text-red-600 hover:bg-red-50 transition">
          🗑️ 刪除此篇故事
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm rounded-xl border border-[#D4C3B0] text-[#5C4433] hover:bg-[#F3ECE2]">取消</button>
          <button type="button" onclick="saveStory()" class="px-5 py-2 text-sm font-medium rounded-xl bg-[#C85A32] hover:bg-[#B04B26] text-white shadow-sm">儲存故事</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'cerita_kita_stories_v2';
    const API_KEY_STORAGE = 'cerita_kita_gemini_key';

    // 預設兩則範例故事
    const DEFAULT_STORIES = [
      {
        story_id: '20261120_001',
        date: '2026-11-20',
        location: '台南 · 線上宵夜聊天',
        mood: '有趣、親切',
        raw_input: "今天聊到印尼泡麵 Indomie，她說一定要加半熟蛋跟超辣辣椒醬才算靈魂吃法，還教我說 'Pedas banget!'",
        media_url: '',
        ai_generated: {
          title: 'Indomie 的靈魂吃法與第一句超辣宣言',
          narrative_summary: '從宵夜話題聊開，她認真傳授了道地印尼乾拌麵的黃金比例，還現學現賣教了一句實用形容詞。',
          indonesian_notes: [
            {
              phrase: 'Pedas banget!',
              literal: '辣 + 非常',
              nuance: "口語常用強調語氣，比教科書的 'Sangat pedas' 更自然道地。",
              pronunciation_hint: 'ㄆㄜ-達斯 邦-厄'
            }
          ],
          cultural_trivia: '印尼人吃 Indomie Mi Goreng（經典炒麵）時，路邊攤（Warkop）常會搭配半熟蛋與大量鳥眼椒（Cabai Rawit）。',
          extracted_preferences: [
            { category: '飲食', detail: '喜歡吃辣、Indomie 必加半熟蛋' }
          ],
          tags: ['#美食', '#印尼語學習', '#日常聊天']
        }
      },
      {
        story_id: '20261125_002',
        date: '2026-11-25',
        location: '台南中西區',
        mood: '溫暖、放鬆',
        raw_input: "下班後一起去喝咖啡，她笑說台灣的手搖飲全糖太甜了，下次要點 'Jangan terlalu manis'（不要太甜），還說很喜歡台南晚上的微風。",
        media_url: '',
        ai_generated: {
          title: '微風與「不要太甜」的飲料點單暗號',
          narrative_summary: '散步聊起台灣與印尼飲料甜度的差異，順便學會了點飲料最實用的客製化印尼文句子。',
          indonesian_notes: [
            {
              phrase: 'Jangan terlalu manis',
              literal: '不要 + 太 + 甜',
              nuance: '點飲料或餐點時超實用，語氣自然委婉。',
              pronunciation_hint: '姜-安 特-拉-盧 瑪-尼斯'
            }
          ],
          cultural_trivia: '印尼當地茶飲（如 Es Teh Manis）傳統上其實偏甜，但年輕族群近年在手搖飲店也越來越常點少糖（Kurang gula）。',
          extracted_preferences: [
            { category: '飲料', detail: '不喜歡太甜的飲料' },
            { category: '氛圍', detail: '喜歡晚上散步吹微風' }
          ],
          tags: ['#見面散步', '#飲食習慣', '#實用短句']
        }
      }
    ];

    let stories = [];
    let selectedTag = 'ALL';
    let editingStoryId = null;
    let currentPhotoBase64 = '';

    // 初始化
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          stories = JSON.parse(saved);
        } catch (e) {
          stories = [...DEFAULT_STORIES];
        }
      } else {
        stories = [...DEFAULT_STORIES];
        persistStories();
      }
      const savedKey = localStorage.getItem(API_KEY_STORAGE);
      if (savedKey) {
        document.getElementById('geminiApiKeyInput').value = savedKey;
      }
      renderAll();
    }

    function persistStories() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
      } catch (e) {
        alert('瀏覽器儲存空間已滿（可能是照片過多），建議先按右上角「匯出 JSON」備份！');
      }
    }

    function saveApiKey(val) {
      localStorage.setItem(API_KEY_STORAGE, val.trim());
    }

    function renderAll() {
      renderPreferences();
      renderTagFilters();
      renderStories();
    }

    // 渲染她的小默契雷達
    function renderPreferences() {
      const container = document.getElementById('preferencesList');
      const allPrefs = [];
      stories.forEach(s => {
        (s.ai_generated?.extracted_preferences || []).forEach(p => {
          allPrefs.push(p);
        });
      });
      document.getElementById('prefCount').textContent = `${allPrefs.length} 項線索`;
      if (allPrefs.length === 0) {
        container.innerHTML = `<span class="text-xs text-[#9E8875]">尚未累積默契線索，新增故事時可記錄她的喜好喔！</span>`;
        return;
      }
      container.innerHTML = allPrefs.map(p => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs bg-[#FDF6EC] border border-[#E8D5BE] text-[#5C4433]">
          <strong class="text-[#C85A32]">${escapeHtml(p.category)}</strong>
          <span>${escapeHtml(p.detail)}</span>
        </span>
      `).join('');
    }

    // 渲染標籤篩選列
    function renderTagFilters() {
      const bar = document.getElementById('tagFilterBar');
      const tagSet = new Set(['ALL']);
      stories.forEach(s => (s.ai_generated?.tags || []).forEach(t => tagSet.add(t)));
      bar.innerHTML = Array.from(tagSet).map(tag => {
        const active = selectedTag === tag;
        const label = tag === 'ALL' ? '全部故事' : tag;
        return `
          <button onclick="setTagFilter('${escapeHtml(tag)}')"
            class="px-3 py-1.5 rounded-full text-xs whitespace-nowrap transition ${active ? 'bg-[#4A3525] text-white font-medium' : 'bg-white border border-[#DFD3C3] text-[#6E5643] hover:bg-[#F3ECE2]'}">
            ${escapeHtml(label)}
          </button>
        `;
      }).join('');
    }

    function setTagFilter(tag) {
      selectedTag = tag;
      renderAll();
    }

    // 渲染故事時間軸卡片
    function renderStories() {
      const grid = document.getElementById('storiesGrid');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = stories.filter(s => {
        const ai = s.ai_generated || {};
        const matchTag = selectedTag === 'ALL' || (ai.tags || []).includes(selectedTag);
        if (!matchTag) return false;
        if (!keyword) return true;
        const haystack = [
          s.date, s.location, s.mood, s.raw_input,
          ai.title, ai.narrative_summary, ai.cultural_trivia,
          ...(ai.tags || []),
          ...(ai.indonesian_notes || []).map(n => `${n.phrase} ${n.nuance}`)
        ].join(' ').toLowerCase();
        return haystack.includes(keyword);
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white/60 rounded-2xl border border-dashed border-[#D6C7B7]">
            <p class="text-sm text-[#7D6654]">找不到符合條件的故事片段，試試切換標籤或新增一則故事吧！</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(story => {
        const ai = story.ai_generated || {};
        const notes = ai.indonesian_notes || [];
        const tags = ai.tags || [];
        const hasPhoto = Boolean(story.media_url);

        return `
          <article id="card-${story.story_id}" class="flip-card perspective-1000">
            <div class="flip-card-inner">
              <!-- 正面：故事與拍立得照片 -->
              <div class="flip-card-front bg-white rounded-2xl border border-[#E6DCD0] p-5 shadow-sm flex flex-col justify-between min-h-[340px]">
                <div>
                  <!-- 頂部日期與操作列 -->
                  <div class="flex items-center justify-between gap-2 text-xs text-[#8C6D53] mb-3">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="font-semibold text-[#C85A32]">📅 ${escapeHtml(story.date)}</span>
                      <span>·</span>
                      <span>📍 ${escapeHtml(story.location || '未標註地點')}</span>
                    </div>

    // --- 照片上傳與 EXIF 自動解析 ---
    async function handlePhotoUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const statusEl = document.getElementById('exifStatusMsg');
      statusEl.textContent = '正在讀取照片 EXIF 拍攝時間與 GPS 座標...';
      document.getElementById('photoPreviewWrap').classList.remove('hidden');
      document.getElementById('removePhotoBtn').classList.remove('hidden');

      // 1. 解析 EXIF 日期與 GPS
      try {
        if (window.exifr) {
          const exif = await window.exifr.parse(file, ['DateTimeOriginal', 'CreateDate', 'latitude', 'longitude']);
          let notes = [];
          const dt = exif?.DateTimeOriginal || exif?.CreateDate;
          if (dt instanceof Date && !isNaN(dt)) {
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            document.getElementById('fieldDate').value = `${yyyy}-${mm}-${dd}`;
            notes.push(`已自動帶入拍攝日期 (${yyyy}-${mm}-${dd})`);
          }
          if (typeof exif?.latitude === 'number' && typeof exif?.longitude === 'number') {
            notes.push('已讀取 GPS 座標，正在轉換地名...');
            statusEl.textContent = notes.join(' · ');
            const placeName = await reverseGeocode(exif.latitude, exif.longitude);
            document.getElementById('fieldLocation').value = placeName;
            notes[notes.length - 1] = `已自動帶入地點：${placeName}`;
          }
          statusEl.textContent = notes.length > 0
            ? '✅ ' + notes.join(' ｜ ')
            : 'ℹ️ 此照片未包含 EXIF 日期或 GPS 資訊，請手動確認日期與地點。';
        }
      } catch (err) {
        statusEl.textContent = 'ℹ️ 無法讀取 EXIF 資訊，請手動填寫日期與地點。';
      }

      // 2. Canvas 壓縮圖片轉為 Base64，避免塞爆 localStorage
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 1200;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('photoPreviewImg').src = currentPhotoBase64;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function reverseGeocode(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        const addr = data.address || {};
        const city = addr.city || addr.county || addr.state || '';
        const district = addr.suburb || addr.town || addr.district || '';
        const spot = addr.amenity || addr.tourism || addr.road || '';
        const combined = [city, district, spot].filter(Boolean).join(' ');
        return combined || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      } catch (e) {
        return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      }
    }

    // AI 自動解析（支援真實 Gemini API 或內建智慧模擬）
    async function runAIAnalysis() {
      const raw = document.getElementById('fieldRawInput').value.trim();

      } catch (err) {

        btn.disabled = false;

    async function callGeminiAPI(apiKey, rawText) {
      const prompt = `你是一位精通台灣文化與印尼年輕人日常口語的雙語故事編輯。請根據以下互動紀錄，輸出純 JSON（不要 markdown 標記），格式如下：
{
  "title": "有畫面感的一句短標題",
  "narrative_summary": "溫暖精煉的兩句故事摘要",
  "indonesian_notes": [
    { "phrase": "印尼文詞彙", "literal": "字面直譯", "pronunciation_hint": "中文諧音", "nuance": "口語語氣與用法" }
  ],
  "cultural_trivia": "相關的印尼文化或生活小補充",
  "extracted_preferences": [
    { "category": "飲食/興趣/習慣", "detail": "具體喜好" }
  ],
  "tags": ["#標籤1", "#標籤2"]
}
互動紀錄：${rawText}`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      });
      if (!res.ok) throw new Error('API 呼叫失敗，請確認金鑰是否正確');
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      return JSON.parse(text);
    }

    // 儲存新增或編輯後的故事
    function saveStory() {
      const date = document.getElementById('fieldDate').value || new Date().toISOString().split('T')[0];
      const location = document.getElementById('fieldLocation').value.trim();
      const mood = document.getElementById('fieldMood').value.trim();
      const raw_input = document.getElementById('fieldRawInput').value.trim();
      const title = document.getElementById('fieldTitle').value.trim() || '日常互動記錄';
      const narrative_summary = document.getElementById('fieldSummary').value.trim() || raw_input;
      const cultural_trivia = document.getElementById('fieldTrivia').value.trim();

      if (!raw_input && !title) {
        alert('請至少填寫故事標題或互動紀錄內容！');
        return;
      }

      const tags = document.getElementById('fieldTags').value
        .split(/[,，]/)
        .map(t => t.trim())
        .filter(Boolean)
        .map(t => t.startsWith('#') ? t : `#${t}`);

      const extracted_preferences = document.getElementById('fieldPrefs').value
        .split(/[,，]/)
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => {
          const idx = item.indexOf(':') !== -1 ? item.indexOf(':') : item.indexOf('：');
          if (idx !== -1) {
            return { category: item.slice(0, idx).trim(), detail: item.slice(idx + 1).trim() };
          }
          return { category: '小默契', detail: item };
        });

      const indonesian_notes = collectNotesFromEditor();

      const storyObj = {
        story_id: editingStoryId || `story_${Date.now()}`,
        date,
        location,
        mood,
        raw_input,
        media_url: currentPhotoBase64,
        ai_generated: {
          title,
          narrative_summary,
          indonesian_notes,
          cultural_trivia,
          extracted_preferences,
          tags
        }
      };

      if (editingStoryId) {
        const idx = stories.findIndex(s => s.story_id === editingStoryId);
        if (idx !== -1) stories[idx] = storyObj;
      } else {
        stories.unshift(storyObj);
      }

      // 依日期由新到舊排序
      stories.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      persistStories();
      closeModal();
      renderAll();
    }

    function deleteCurrentStory() {
      if (!editingStoryId) return;
      if (!confirm('確定要刪除這篇故事嗎？刪除後無法復原喔。')) return;
      stories = stories.filter(s => s.story_id !== editingStoryId);
      persistStories();
      closeModal();
      renderAll();
    }

    // 匯出與匯入 JSON 備份
    function exportJSON() {
      const blob = new Blob([JSON.stringify(stories, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cerita_kita_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('格式不符');
          stories = imported;
          persistStories();
          renderAll();
          alert(`成功匯入 ${stories.length} 則故事！`);
        } catch (err) {
          alert('JSON 檔案格式不正確，請確認是否為本工具匯出的備份檔。');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
